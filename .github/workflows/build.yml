name: Build and test
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Execute console harness and custom predicates
        shell: pwsh
        run: ./Test-Guan.ps1
      - name: Build NuGet package
        shell: pwsh
        run: ./Build-NugetPackage.ps1
      - name: Verify script SDK and configuration isolation
        shell: pwsh
        run: ./Test-BuildScripts.ps1
      - name: Verify Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Test-BuildScripts.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: guan-${{ matrix.os }}
          path: |
            bin/release/Guan/Nugets/*.nupkg
            *.log
